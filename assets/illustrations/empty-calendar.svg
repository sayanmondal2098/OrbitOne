<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#FFF5F0" opacity="0.5"/>
  
  <!-- Calendar grid -->
  <g transform="translate(50, 40)">
    <!-- Calendar frame -->
    <rect x="0" y="0" width="100" height="100" fill="none" stroke="#F093FB" stroke-width="2" rx="8"/>
    
    <!-- Title bar -->
    <rect x="0" y="0" width="100" height="20" fill="#F093FB" opacity="0.2" rx="8"/>
    <text x="50" y="14" text-anchor="middle" font-family="Arial" font-size="8" fill="#F093FB" font-weight="bold">Feb</text>
    
    <!-- Grid lines -->
    <line x1="0" y1="20" x2="100" y2="20" stroke="#F093FB" stroke-width="1" opacity="0.3"/>
    <line x1="20" y1="20" x2="20" y2="100" stroke="#F093FB" stroke-width="0.5" opacity="0.2"/>
    <line x1="40" y1="20" x2="40" y2="100" stroke="#F093FB" stroke-width="0.5" opacity="0.2"/>
    <line x1="60" y1="20" x2="60" y2="100" stroke="#F093FB" stroke-width="0.5" opacity="0.2"/>
    <line x1="80" y1="20" x2="80" y2="100" stroke="#F093FB" stroke-width="0.5" opacity="0.2"/>
    
    <!-- Sample dates -->
    <circle cx="30" cy="35" r="3" fill="#F5576C" opacity="0.6"/>
    <circle cx="50" cy="55" r="3" fill="#F5576C"/>
    <circle cx="70" cy="75" r="3" fill="#F5576C" opacity="0.4"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="165" text-anchor="middle" font-family="Arial" font-size="14" fill="#F093FB" font-weight="bold">No Events</text>
</svg>