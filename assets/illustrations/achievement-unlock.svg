<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#FFFAF5" opacity="0.5"/>
  
  <!-- Trophy/Achievement -->
  <g transform="translate(100, 80)">
    <!-- Trophy base -->
    <rect x="-15" y="30" width="30" height="8" fill="#FFD700" rx="2"/>
    
    <!-- Trophy stem -->
    <rect x="-4" y="20" width="8" height="15" fill="#FFA500"/>
    
    <!-- Trophy cup -->
    <path d="M -25 20 L -18 -5 Q -18 -15 -10 -15 L 10 -15 Q 18 -15 18 -5 L 25 20" fill="#FFD700"/>
    <path d="M -25 20 L -20 18 Q -20 -8 -10 -13 L 10 -13 Q 20 -8 20 18 L 25 20" fill="#FFE44D" opacity="0.6"/>
    
    <!-- Trophy handles -->
    <path d="M -25 10 Q -35 5 -32 -5" fill="none" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <path d="M 25 10 Q 35 5 32 -5" fill="none" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Star on top -->
    <circle cx="0" cy="-20" r="8" fill="#FFD700"/>
    <text x="0" y="-15" text-anchor="middle" font-family="Arial" font-size="20" fill="#FFA500">★</text>
  </g>
  
  <!-- Text -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial" font-size="14" fill="#FFA500" font-weight="bold">Achievement!</text>
</svg>