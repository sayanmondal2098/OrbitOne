<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#FFF5F0" opacity="0.5"/>
  
  <!-- Clock/Time management illustration -->
  <g transform="translate(100, 90)">
    <!-- Clock circle -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#F5576C" stroke-width="3" opacity="0.2"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#F5576C" stroke-width="2.5"/>
    
    <!-- Clock center -->
    <circle cx="0" cy="0" r="4" fill="#F5576C"/>
    
    <!-- Hour markers -->
    <circle cx="0" cy="-28" r="2" fill="#F5576C"/>
    <circle cx="28" cy="0" r="2" fill="#F5576C"/>
    <circle cx="0" cy="28" r="2" fill="#F5576C"/>
    <circle cx="-28" cy="0" r="2" fill="#F5576C"/>
    
    <!-- Hour hand (pointing to 10) -->
    <line x1="0" y1="0" x2="-12" y2="-16" stroke="#F5576C" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Minute hand (pointing to 2) -->
    <line x1="0" y1="0" x2="20" y2="-10" stroke="#667EEA" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Second hand (pointing to 6) -->
    <line x1="0" y1="0" x2="0" y2="24" stroke="#43E97B" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Time text inside -->
    <text x="0" y="8" text-anchor="middle" font-family="Arial" font-size="10" fill="#F5576C" font-weight="bold">Time</text>
  </g>
  
  <!-- Text -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial" font-size="14" fill="#F5576C" font-weight="bold">Time Matters</text>
</svg>