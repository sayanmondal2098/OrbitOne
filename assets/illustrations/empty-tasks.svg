<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#F0F4FF" opacity="0.5"/>
  
  <!-- Checkmark -->
  <g transform="translate(100, 100)">
    <!-- Large checkmark circle -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#667EEA" stroke-width="4" opacity="0.2"/>
    
    <!-- Checkmark -->
    <path d="M -20 0 L 0 20 L 30 -15" fill="none" stroke="#667EEA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Small decorative circles -->
    <circle cx="-35" cy="-25" r="6" fill="#764BA2" opacity="0.3"/>
    <circle cx="40" cy="35" r="5" fill="#667EEA" opacity="0.3"/>
  </g>
  
  <!-- Text -->
