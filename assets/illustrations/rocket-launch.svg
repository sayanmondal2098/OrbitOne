<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#E8F4FD" opacity="0.5"/>
  
  <!-- Rocket illustration -->
  <g transform="translate(100, 50)">
    <!-- Rocket body -->
    <path d="M -8 -30 L -8 20 Q 0 25 8 20 L 8 -30 Q 0 -35 -8 -30" fill="#667EEA"/>
    
    <!-- Rocket window -->
    <circle cx="0" cy="-20" r="4" fill="#FFF" opacity="0.8"/>
    
    <!-- Rocket fins left -->
    <path d="M -8 15 L -18 25 L -8 22 Z" fill="#F5576C"/>
    
    <!-- Rocket fins right -->
    <path d="M 8 15 L 18 25 L 8 22 Z" fill="#F5576C"/>
    
    <!-- Rocket fire/thrust -->
    <path d="M -4 22 L -6 35 L 0 25 L 6 35 L 4 22 Z" fill="#FF6B6B"/>
    <path d="M -2 25 L -4 32 L 0 27 L 4 32 L 2 25 Z" fill="#FFA500" opacity="0.8"/>
    
    <!-- Stars around rocket -->
    <circle cx="25" cy="-20" r="1.5" fill="#FFD700"/>
    <circle cx="-25" cy="-10" r="1.5" fill="#FFD700"/>
    <circle cx="20" cy="5" r="1" fill="#FFD700" opacity="0.6"/>
  </g>
  
  <!-- Progress indicators -->
  <g transform="translate(100, 145)">
    <circle cx="-15" cy="0" r="4" fill="#667EEA"/>
    <circle cx="0" cy="0" r="4" fill="#667EEA" opacity="0.5"/>
    <circle cx="15" cy="0" r="4" fill="#667EEA" opacity="0.3"/>
    
    <!-- Progress line -->
    <line x1="-11" y1="0" x2="-4" y2="0" stroke="#667EEA" stroke-width="2"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="185" text-anchor="middle" font-family="Arial" font-size="12" fill="#667EEA" font-weight="bold">Launch</text>
</svg>